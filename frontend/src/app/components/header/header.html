<header class="site-header">
  <div class="header-top">
    <a routerLink="/" class="logo">Freaky Fashion</a>

    <!-- preventDefault() hindrar sidan från att laddas om vid submit -->
    <form (submit)="onSearch(searchInput.value); $event.preventDefault()">
      <input #searchInput type="text" placeholder="Sök produkt" />
      <button type="submit" aria-label="Sök">
        <span class="material-symbols-outlined">search</span>
      </button>
    </form>

    <div class="header-icons">
      <a href="#" aria-label="Favoriter" class="icon-link">
        <span class="material-symbols-outlined">favorite</span>
      </a>
      <a href="#" aria-label="Varukorg" class="icon-link">
        <span class="material-symbols-outlined">shopping_bag</span>
      </a>
    </div>
  </div>

  <nav class="main-nav">
    <a href="#">Nyheter</a>
    <a href="#">Topplistan</a>
    <a href="#">Rea</a>
    <a href="#">Kampanjer</a>
  </nav>
</header>
